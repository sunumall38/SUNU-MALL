name: Release

# Un tag vX.Y.Z poussé sur GitHub crée la « Release » correspondante, avec
# les notes de la section du CHANGELOG. Le tag doit correspondre au fichier
# VERSION (scripts/release.sh s'en charge).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que le tag correspond au fichier VERSION
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(tr -d '[:space:]' < VERSION)"
          pkg="$(node -p "require('./frontend/package.json').version")"
          if [ "$tag" != "$file" ] || [ "$tag" != "$pkg" ]; then
            echo "Tag v$tag ≠ VERSION ($file) ou frontend/package.json ($pkg)" >&2
            exit 1
          fi

      - name: Extraire les notes de version du CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Voir CHANGELOG.md." > release-notes.md
          fi

      - name: Créer la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --title "SUNU MALL $GITHUB_REF_NAME" \
            --notes-file release-notes.md $prerelease
