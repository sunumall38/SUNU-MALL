# =========================================================
# SUNU MALL — Blueprint Render (API Django)
#
# Offre gratuite de Render : un service web et un Key Value (Redis). La base
# PostgreSQL est chez Neon, le frontend sur Cloudflare Pages.
# Marche à suivre : docs/deploiement-render-cloudflare.md
#
# Limites de l'offre gratuite à connaître :
#   - le service web s'endort après 15 minutes sans trafic ;
#   - pas de Shell : le premier administrateur est créé par
#     manage.py bootstrap_admin à partir des variables ADMIN_BOOTSTRAP_* ;
#   - pas de worker ni de tâche planifiée : les traitements quotidiens sont
#     lancés au démarrage du service (manage.py run_daily_tasks --if-due) et
#     vérifiés pendant le trafic, au plus une fois par heure — ce qui suffit
#     aussi sur une offre payante, où le service ne redémarre plus.
#
# Limites de requêtes de l'API (par défaut 300/min par visiteur, 600/min par
# compte) : variables API_ANON_THROTTLE_RATE / API_USER_THROTTLE_RATE.
# =========================================================

services:
  - type: web
    name: sunu-mall-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Migrations, version, premier admin et traitements quotidiens, puis
    # gunicorn : voir backend/render-start.sh. Un seul mot ici, car Render
    # exécute dockerCommand dans son propre shell (sh -c "…" y échoue).
    dockerCommand: /app/render-start.sh
    healthCheckPath: /health/live/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: PROCESS_TYPE
        value: web
      # 512 Mo de RAM : un seul worker gunicorn. Les threads servent aussi le
      # flux temps réel du suivi de livraison (une connexion = un thread) ;
      # au plus la moitié (SSE_MAX_CONCURRENT_STREAMS, 4 par défaut ici) lui
      # est accordée, les suivis suivants passent au polling.
      - key: WEB_CONCURRENCY
        value: "1"
      - key: GUNICORN_THREADS
        value: "8"
      # TLS terminé par Render ; ses contrôles de santé arrivent en HTTP.
      - key: SECURE_SSL_REDIRECT
        value: "False"
      # Base PostgreSQL durable hébergée chez Neon (gratuite, n'expire pas,
      # région Frankfurt). Coller l'URL « direct » (sans pooler) du projet
      # Neon sunu-mall, avec ?sslmode=require — voir docs/deploiement-render-cloudflare.md.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          name: sunu-mall-redis
          type: keyvalue
          property: connectionString
      # Paiements simulés pendant la démonstration. À passer à False AVANT
      # d'installer les clés Wave / Orange Money (voir config/settings/checks.py).
      - key: PAYMENT_SANDBOX
        value: "True"

      # --- À renseigner à la création (aucune valeur dans le dépôt) ---
      # Adresse publique du frontend Cloudflare Pages, sans barre finale,
      # ex. https://sunu-mall.pages.dev (la même dans les deux variables).
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # Email transactionnel par l'API Gmail (HTTPS : le SMTP sortant est
      # bloqué sur l'offre gratuite de Render). Compte sunumall38@gmail.com,
      # identifiants OAuth décrits dans docs/deploiement-render-cloudflare.md.
      - key: EMAIL_PROVIDER
        value: gmail_api
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      # Ex. « SUNU MALL <sunumall38@gmail.com> » (l'adresse du compte Gmail).
      - key: DEFAULT_FROM_EMAIL
        sync: false
      # Boîte qui reçoit les demandes de boutique et les messages de contact.
      - key: ADMIN_NOTIFICATION_EMAIL
        sync: false
      # Premier compte super-administrateur, créé au démarrage s'il n'existe
      # pas (l'offre gratuite n'a pas de Shell). Supprimer le mot de passe des
      # variables après la première connexion.
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PHONE
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      # Codes de vérification par SMS : « twilio » une fois le compte Twilio
      # prêt (variables TWILIO_* à ajouter dans le tableau de bord), sinon
      # « local » (vérification par email uniquement).
      - key: PHONE_OTP_PROVIDER
        value: local
      # Stockage S3 des images (bucket média) et des pièces KYC (bucket privé).
      - key: MINIO_ENDPOINT
        sync: false
      - key: MINIO_ACCESS_KEY
        sync: false
      - key: MINIO_SECRET_KEY
        sync: false
      - key: MINIO_BUCKET
        sync: false
      - key: MINIO_USE_SSL
        value: "True"
      # Région du fournisseur S3 (ex. eu-central-003 chez Backblaze B2,
      # auto chez Cloudflare R2).
      - key: S3_REGION_NAME
        sync: false
      - key: S3_QUERYSTRING_AUTH
        value: "True"
      - key: KYC_STORAGE_BACKEND
        value: s3
      - key: KYC_STORAGE_BUCKET
        sync: false
      - key: KYC_STORAGE_AUTO_CREATE
        value: "False"

  - type: keyvalue
    name: sunu-mall-redis
    plan: free
    region: frankfurt
    # Accessible uniquement depuis le réseau privé de Render.
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru
